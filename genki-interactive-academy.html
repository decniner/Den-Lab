const LESSONS=[{"id":1,"title":"New Friends","description":"Introductions and identity","jp":"わたしは りなです。","en":"I am Rina.","rule":"X は Y です","explain":"Think of は as “as for…”: it marks the topic you are introducing, and です makes a polite identification or description. In わたしは りなです, the sentence gives information about わたし. In conversation, speakers often omit わたしは when the topic is already clear.","builder":["わたし","は","りな","です"],"builderEn":"I am Rina.","vocab":[{"jp":"わたし","en":"I","category":"pronoun","romaji":"watashi","example":"わたしは りなです。","exampleEn":"I am Rina.","id":"1-0"},{"jp":"がくせい","en":"student","category":"noun","romaji":"gakusei","example":"わたしは がくせいです。","exampleEn":"I am a student.","id":"1-1"},{"jp":"せんせい","en":"teacher","category":"noun","romaji":"sensei","example":"たなかさんは せんせいです。","exampleEn":"Mr. Tanaka is a teacher.","id":"1-2"},{"jp":"ともだち","en":"friend","category":"noun","romaji":"tomodachi","example":"りなさんは わたしの ともだちです。","exampleEn":"Rina is my friend.","id":"1-3"},{"jp":"にほん","en":"Japan","category":"place","romaji":"nihon","example":"にほんへ いきます。","exampleEn":"I am going to Japan.","id":"1-4"},{"jp":"なまえ","en":"name","category":"noun","romaji":"namae","example":"おなまえは なんですか。","exampleEn":"What is your name?","id":"1-5"},{"jp":"はじめまして","en":"nice to meet you","category":"phrase","romaji":"hajimemashite","example":"はじめまして。わたしは りなです。","exampleEn":"Nice to meet you. I am Rina.","id":"1-6"},{"jp":"よろしくおねがいします","en":"pleased to meet you","category":"phrase","romaji":"yoroshiku onegaishimasu","example":"どうぞ よろしくおねがいします。","exampleEn":"I look forward to getting to know you.","id":"1-7"}],"mistake":"When は marks the topic, pronounce it wa, not ha. It does not itself mean “is”; です completes this polite sentence.","dialogue":[{"who":"A","jp":"わたしは りなです。","en":"I am Rina."},{"who":"B","jp":"はじめまして。わたしは けんです。よろしくおねがいします。","en":"Nice to meet you. I am Ken. I look forward to getting to know you."}],"responseOptions":["はじめまして。わたしは けんです。よろしくおねがいします。","これは いくらですか。","あした えいがを みます。"],"responseAnswer":0},{"id":2,"title":"Shopping","description":"Objects and prices","jp":"これは いくらですか。","en":"How much is this?","rule":"これ・それ・あれ","explain":"Use これ, それ, and あれ as standalone words for an item: これ is near the speaker, それ near the listener, and あれ away from both. To put a noun after the demonstrative, use この, その, or あの instead (この本). Ask the price with [item] は いくらですか.","builder":["これ","は","いくら","です","か"],"builderEn":"How much is this?","vocab":[{"jp":"これ","en":"this","category":"demonstrative","romaji":"kore","example":"これは わたしの ほんです。","exampleEn":"This is my book.","id":"2-0"},{"jp":"それ","en":"that (near you)","category":"demonstrative","romaji":"sore","example":"それは あなたの かばんですか。","exampleEn":"Is that your bag?","id":"2-1"},{"jp":"あれ","en":"that (over there)","category":"demonstrative","romaji":"are","example":"あれは えきです。","exampleEn":"That over there is a station.","id":"2-2"},{"jp":"ほん","en":"book","category":"noun","romaji":"hon","example":"ほんを 2さつ かいました。","exampleEn":"I bought two books.","id":"2-3"},{"jp":"かばん","en":"bag","category":"noun","romaji":"kaban","example":"かばんを みせてください。","exampleEn":"Please show me the bag.","id":"2-4"},{"jp":"えん","en":"yen","category":"noun","romaji":"en","example":"この ほんは 500えんです。","exampleEn":"This book is 500 yen.","id":"2-5"},{"jp":"いくら","en":"how much","category":"question","romaji":"ikura","example":"この かばんは いくらですか。","exampleEn":"How much is this bag?","id":"2-6"},{"jp":"たかい","en":"expensive","category":"adjective","romaji":"takai","example":"この ほんは たかいです。","exampleEn":"This book is expensive.","id":"2-7"}],"mistake":"Do not place a noun directly after これ, それ, or あれ. Say これです or この本; use この, その, あの before a noun.","dialogue":[{"who":"A","jp":"これは いくらですか。","en":"How much is this?"},{"who":"B","jp":"500えんです。","en":"It is 500 yen."}],"responseOptions":["500えんです。","はじめまして。","きのう こうえんに いきました。"],"responseAnswer":0},{"id":3,"title":"Making Plans","description":"Daily actions and invitations","jp":"あした えいがを みます。","en":"I will watch a movie tomorrow.","rule":"を and ます","explain":"Put を after the thing receiving the action and before the verb; this particle is pronounced “o.” The ます ending is polite and nonpast, so it can describe a habit or a future plan. In あした えいがを みます, あした makes the action future: “I will watch a movie tomorrow.”","builder":["あした","えいが","を","みます"],"builderEn":"I will watch a movie tomorrow.","vocab":[{"jp":"みます","en":"watch / see","category":"verb","romaji":"mimasu","example":"えいがを みます。","exampleEn":"I watch a movie.","id":"3-0"},{"jp":"のみます","en":"drink","category":"verb","romaji":"nomimasu","example":"みずを のみます。","exampleEn":"I drink water.","id":"3-1"},{"jp":"たべます","en":"eat","category":"verb","romaji":"tabemasu","example":"あさごはんを たべます。","exampleEn":"I eat breakfast.","id":"3-2"},{"jp":"いきます","en":"go","category":"verb","romaji":"ikimasu","example":"きょうとへ いきます。","exampleEn":"I am going to Kyoto.","id":"3-3"},{"jp":"あした","en":"tomorrow","category":"time","romaji":"ashita","example":"あした がっこうへ いきます。","exampleEn":"I will go to school tomorrow.","id":"3-4"},{"jp":"きょう","en":"today","category":"time","romaji":"kyou","example":"きょう うちで べんきょうします。","exampleEn":"I will study at home today.","id":"3-5"},{"jp":"えいが","en":"movie","category":"noun","romaji":"eiga","example":"あした えいがを みます。","exampleEn":"I will watch a movie tomorrow.","id":"3-6"},{"jp":"みず","en":"water","category":"noun","romaji":"mizu","example":"つめたい みずを のみます。","exampleEn":"I drink cold water.","id":"3-7"}],"mistake":"Do not use を for where an action happens: use で for an activity location. Also, ます is not present-only; a time word such as あした can make it future.","dialogue":[{"who":"A","jp":"あした えいがを みます。","en":"I will watch a movie tomorrow."},{"who":"B","jp":"いいですね。どんな えいがですか。","en":"That sounds nice. What kind of movie is it?"}],"responseOptions":["いいですね。どんな えいがですか。","この かばんは 500えんです。","おだいじにしてください。"],"responseAnswer":0},{"id":4,"title":"A Day in Town","description":"Past events and locations","jp":"きのう こうえんに いきました。","en":"I went to the park yesterday.","rule":"ました and に","explain":"Change the polite ます form to ました to describe a completed past action: いきます becomes いきました. Put に or へ after a destination and before a movement verb. In きのう こうえんに いきました, きのう sets the past time and に marks the park as the destination.","builder":["きのう","こうえん","に","いきました"],"builderEn":"I went to the park yesterday.","vocab":[{"jp":"きのう","en":"yesterday","category":"time","romaji":"kinou","example":"きのうは とても いそがしかったです。","exampleEn":"I was very busy yesterday.","id":"4-0"},{"jp":"こうえん","en":"park","category":"place","romaji":"kouen","example":"こうえんで さんぽします。","exampleEn":"I take a walk in the park.","id":"4-1"},{"jp":"がっこう","en":"school","category":"place","romaji":"gakkou","example":"がっこうに せんせいが います。","exampleEn":"There is a teacher at school.","id":"4-2"},{"jp":"いきました","en":"went","category":"verb","romaji":"ikimashita","example":"きのう こうえんに いきました。","exampleEn":"I went to the park yesterday.","id":"4-3"},{"jp":"ありました","en":"existed (inanimate)","category":"verb","romaji":"arimashita","example":"つくえの うえに ほんが ありました。","exampleEn":"There was a book on the desk.","id":"4-4"},{"jp":"いました","en":"was (animate)","category":"verb","romaji":"imashita","example":"へやに ねこが いました。","exampleEn":"There was a cat in the room.","id":"4-5"},{"jp":"どこ","en":"where","category":"question","romaji":"doko","example":"えきは どこですか。","exampleEn":"Where is the station?","id":"4-6"},{"jp":"うち","en":"home","category":"place","romaji":"uchi","example":"うちに かえります。","exampleEn":"I am going home.","id":"4-7"}],"mistake":"Use に/へ for where you are going, but で for where an activity happens. Avoid saying こうえんでいきました when you mean “went to the park.”","dialogue":[{"who":"A","jp":"きのう こうえんに いきました。","en":"I went to the park yesterday."},{"who":"B","jp":"そうですか。たのしかったですか。","en":"I see. Did you have a good time?"}],"responseOptions":["そうですか。たのしかったですか。","よろしくおねがいします。","みずを ください。"],"responseAnswer":0},{"id":5,"titl le":"A Busy Morning","description":"Requests and te-form","jp":"まどを あけてください。","en":"Please open the window.","rule":"てください","explain":"Make a request by changing the verb to its て-form, then adding ください: あけます → あけて → あけてください. Use this for a clear, polite everyday request, such as asking someone to open a window. The action requested comes before ください.","builder":["まど","を","あけて","ください"],"builderEn":"Please open the window.","vocab":[{"jp":"あけて","en":"open (te-form)","category":"verb","romaji":"akete","example":"まどを あけてください。","exampleEn":"Please open the window.","id":"6-0"},{"jp":"しめて","en":"close (te-form)","category":"verb","romaji":"shimete","example":"ドアを しめてください。","exampleEn":"Please close the door.","id":"6-1"},{"jp":"まって","en":"wait (te-form)","category":"verb","romaji":"matte","example":"ここで ちょっと まってください。","exampleEn":"Please wait here for a moment.","id":"6-2"},{"jp":"ください","en":"please (request)","category":"phrase","romaji":"kudasai","example":"みずを ください。","exampleEn":"Water, please.","id":"6-3"},{"jp":"まど","en":"window","category":"noun","romaji":"mado","example":"まどから とりが みえます。","exampleEn":"I can see a bird through the window.","id":"6-4"},{"jp":"ドア","en":"door","category":"noun","romaji":"doa","example":"ドアの まえに います。","exampleEn":"I am in front of the door.","id":"6-5"},{"jp":"あさ","en":"morning","category":"time","romaji":"asa","example":"あさ 7じに おきます。","exampleEn":"I get up at 7 in the morning.","id":"6-6"},{"jp":"いそがしい","en":"busy","category":"adjective","romaji":"isogashii","example":"きょうは いそがしいです。","exampleEn":"I am busy today.","id":"6-7"}],"mistake":"Do not attach ください directly to the ます form: あけますください is incorrect. Change the verb to て-form first: あけてください.","dialogue":[{"who":"A","jp":"まどを あけてください。","en":"Please open the window."},{"who":"B","jp":"はい、すぐ あけますね。","en":"Yes, I will open it right away."}],"responseOptions":["はい、すぐ あけますね。","この えいがは おもしろいです。","おなまえは なんですか。"],"responseAnswer":0},{"id":7,"title":"People Around Us","description":"Family and ongoing actions","jp":"あねは ほんを よんでいます。","en":"My older sister is reading a book.","rule":"ています","explain":"Use a verb’s て-form + います to describe an action in progress: よんでいます means “is reading.” The subject can be omitted when it is clear, as in あねは ほんを よんでいます. Depending on the verb and context, ています can also describe a continuing state, so do not translate every use as “-ing.”","builder":["あね","は","ほん","を","よんでいます"],"builderEn":"My older sister is reading a book.","vocab":[{"jp":"あね","en":"my older sister","category":"family","romaji":"ane","example":"あねは とうきょうに すんでいます。","exampleEn":"My older sister lives in Tokyo.","id":"7-0"},{"jp":"あに","en":"my older brother","category":"family","romaji":"ani","example":"あには くるまで かいしゃへ いきます。","exampleEn":"My older brother goes to work by car.","id":"7-1"},{"jp":"いもうと","en":"my younger sister","category":"family","romaji":"imouto","example":"いもうとは こうこうせいです。","exampleEn":"My younger sister is a high school student.","id":"7-2"},{"jp":"おとうと","en":"my younger brother","category":"family","romaji":"otouto","example":"おとうとは 10さいです。","exampleEn":"My younger brother is ten years old.","id":"7-3"},{"jp":"よんでいます","en":"is reading","category":"verb","romaji":"yonde imasu","example":"ほんを よんでいます。","exampleEn":"I am reading a book.","id":"7-4"},{"jp":"はたらいています","en":"is working","category":"verb","romaji":"hataraite imasu","example":"ちちは かいしゃで はたらいています。","exampleEn":"My father works at a company.","id":"7-5"},{"jp":"しゃしん","en":"photograph","category":"noun","romaji":"shashin","example":"りょこうの しゃしんを とりました。","exampleEn":"I took travel photos.","id":"7-6"},{"jp":"かぞく","en":"family","category":"noun","romaji":"kazoku","example":"わたしの かぞくは 4人です。","exampleEn":"There are four people in my family.","id":"7-7"}],"mistake":"Do not assume ています always means an action happening right now. With some verbs it describes a state that continues after a change; use the sentence context.","dialogue":[{"who":"A","jp":"あねは ほんを よんでいます。","en":"My older sister is reading a book."},{"who":"B","jp":"そうですか。どんな ほんですか。","en":"I see. What kind of book is it?"}],"responseOptions":["そうですか。どんな ほんですか。","あした バスで いきます。","これは いくらですか。"],"responseAnswer":0},{"id":8,"title":"Weekend Barbecue","description":"Casual speech and opinions","jp":"この やさいは おいしいと おもいます。","en":"I think these vegetables are delicious.","rule":"とおもいます","explain":"Place the plain form of a thought before とおもいます: おいしい + とおもいます means “I think it is delicious.” Keep the clause before と in plain form even though おもいます is polite. This pattern lets you share an opinion or a prediction without presenting it as a certainty.","builder":["この","やさい","は","おいしい","と","おもいます"],"builderEn":"I think these vegetables are delicious.","vocab":[{"jp":"やさい","en":"vegetable","category":"noun","romaji":"yasai","example":"やさいを たくさん たべます。","exampleEn":"I eat lots of vegetables.","id":"8-0"},{"jp":"にく","en":"meat","category":"noun","romaji":"niku","example":"ぶたにくを かいました。","exampleEn":"I bought pork.","id":"8-1"},{"jp":"おいしい","en":"delicious","category":"adjective","romaji":"oishii","example":"この ケーキは おいしいです。","exampleEn":"This cake is delicious.","id":"8-2"},{"jp":"おもいます","en":"think","category":"verb","romaji":"omoimasu","example":"すしは おいしいと おもいます。","exampleEn":"I think sushi is delicious.","id":"8-3"},{"jp":"いいます","en":"say","category":"verb","romaji":"iimasu","example":"せんせいは「いいですね」と いいます。","exampleEn":"The teacher says, “That is nice.”","id":"8-4"},{"jp":"たのしい","en":"fun","category":"adjective","romaji":"tanoshii","example":"ともだちと はなすのは たのしいです。","exampleEn":"Talking with friends is fun.","id":"8-5"},{"jp":"しゅうまつ","en":"weekend","category":"time","romaji":"shuumatsu","example":"しゅうまつは うちで やすみます。","exampleEn":"I rest at home on the weekend.","id":"8-6"},{"jp":"りょうり","en":"cooking / cuisine","category":"noun","romaji":"ryouri","example":"にほんの りょうりを つくります。","exampleEn":"I cook Japanese food.","id":"8-7"}],"mistake":"Do not put the polite です or ます form inside the thought before と: use おいしいとおもいます, not おいしいですとおもいます.","dialogue":[{"who":"A","jp":"この やさいは おいしいと おもいます。","en":"I think these vegetables are delicious."},{"who":"B","jp":"わたしも そう おもいます。","en":"I think so too."}],"responseOptions":["わたしも そう おもいます。","まどを しめてください。","どこに ありますか。"],"responseAnswer":0},{"id":9,"title":"At the Theater","description":"Past informal and noun modifiers","jp":"きのう みた えいがは おもしろかったです。","en":"The movie I saw yesterday was interesting.","rule":"Noun-modifying clauses","explain":"A plain-form clause can describe a noun by coming immediately before it. In きのう みた えいが, きのう みた (“saw yesterday”) tells us which えいが (“movie”) is meant. Japanese places this description before the noun; English often puts “that I saw yesterday” after it.","builder":["きのう","みた","えいが","は","おもしろかった","です"],"builderEn":"The movie I saw yesterday was interesting.","vocab":[{"jp":"みた","en":"saw","category":"verb","romaji":"mita","example":"きのう えいがを みた。","exampleEn":"I watched a movie yesterday.","id":"9-0"},{"jp":"きいた","en":"heard / asked","category":"verb","romaji":"kiita","example":"ともだちに はなしを きいた。","exampleEn":"I heard a story from my friend.","id":"9-1"},{"jp":"ながい","en":"long","category":"adjective","romaji":"nagai","example":"この えいがは 2じかん ながいです。","exampleEn":"This movie is two hours long.","id":"9-2"},{"jp":"みじかい","en":"short","category":"adjective","romaji":"mijikai","example":"この えんぴつは みじかいです。","exampleEn":"This pencil is short.","id":"9-3"},{"jp":"げき","en":"play / drama","category":"noun","romaji":"geki","example":"きのう げきを みました。","exampleEn":"I watched a play yesterday.","id":"9-4"},{"jp":"ぶたい","en":"stage","category":"noun","romaji":"butai","example":"ぶたいの うえで うたいます。","exampleEn":"I sing on the stage.","id":"9-5"},{"jp":"おもしろい","en":"interesting","category":"adjective","romaji":"omoshiroi","example":"この ほんは おもしろいです。","exampleEn":"This book is interesting.","id":"9-6"},{"jp":"きのう","en":"yesterday","category":"time","romaji":"kinou","example":"きのう ともだちに あいました。","exampleEn":"I met a friend yesterday.","id":"9-7"}],"mistake":"Do not copy English word order or insert の between a verb clause and its noun. Say きのうみたえいが, with the describing clause immediately before えいが.","dialogue":[{"who":"A","jp":"きのう みた えいがは おもしろかったです。","en":"The movie I saw yesterday was interesting."},{"who":"B","jp":"そうですか。どの ところが おもしろかったですか。","en":"I see. Which part was interesting?"}],"responseOptions":["そうですか。どの ところが おもしろかったですか。","みずを のみます。","よろしくおねがいします。"],"responseAnswer":0},{"id":10,"title":"Winter Break","description":"Comparisons and plans","jp":"でんしゃは バスより はやいです。","en":"Trains are faster than buses.","rule":"A は B より adjective","explain":"In A は B より adjective, より comes after the comparison baseline (B), meaning “than B.” The adjective describes A, the item being compared: でんしゃは バスより はやいです means “Trains are faster than buses.” You can leave the comparison context unstated when it is already understood.","builder":["でんしゃ","は","バス","より","はやいです"],"builderEn":"Trains are faster than buses.","vocab":[{"jp":"でんしゃ","en":"train","category":"noun","romaji":"densha","example":"でんしゃで しごとへ いきます。","exampleEn":"I go to work by train.","id":"10-0"},{"jp":"バス","en":"bus","category":"noun","romaji":"basu","example":"バスで がっこうへ いきます。","exampleEn":"I go to school by bus.","id":"10-1"},{"jp":"はやい","en":"fast / early","category":"adjective","romaji":"hayai","example":"この でんしゃは はやいです。","exampleEn":"This train is fast.","id":"10-2"},{"jp":"おそい","en":"slow / late","category":"adjective","romaji":"osoi","example":"バスは でんしゃより おそいです。","exampleEn":"The bus is slower than the train.","id":"10-3"},{"jp":"より","en":"than","category":"particle","romaji":"yori","example":"ねこより いぬの ほうが おおきいです。","exampleEn":"Dogs are bigger than cats.","id":"10-4"},{"jp":"ふゆ","en":"winter","category":"time","romaji":"fuyu","example":"ふゆに スキーを します。","exampleEn":"I ski in winter.","id":"10-5"},{"jp":"やすみ","en":"holiday / break","category":"noun","romaji":"yasumi","example":"らいしゅうは やすみです。","exampleEn":"I am off next week.","id":"10-6"},{"jp":"よてい","en":"plan / schedule","category":"noun","romaji":"yotei","example":"あしたの よていは なんですか。","exampleEn":"What are your plans for tomorrow?","id":"10-7"}],"mistake":"Do not put より after the item being described. Place it after the baseline: バスより; then describe the comparison item before より.","dialogue":[{"who":"A","jp":"でんしゃは バスより はやいです。","en":"Trains are faster than buses."},{"who":"B","jp":"そうですね。でんしゃの ほうが はやいですね。","en":"That’s right. The train is faster."}],"responseOptions":["そうですね。でんしゃの ほうが はやいですね。","はじめまして。","あたまが いたいです。"],"responseAnswer":0},{"id":11,"title":"New Experiences","description":"Experience and desire","jp":"きょうとに いったことが あります。","en":"I have been to Kyoto.","rule":"たことがあります","explain":"Use a verb’s plain past form + ことがあります to ask or say whether an experience has happened before: すしを たべたことがあります (“I have eaten sushi before”). Keep the verb in plain past (た/だ) and put polite あります at the end. For a specific event with a past time, use the ordinary past form instead.","builder":["きょうと","に","いった","こと","が","あります"],"builderEn":"I have been to Kyoto.","vocab":[{"jp":"けいけん","en":"experience","category":"noun","romaji":"keiken","example":"りょこうの けいけんが あります。","exampleEn":"I have travel experience.","id":"11-0"},{"jp":"りょこう","en":"travel","category":"noun","romaji":"ryokou","example":"らいねん にほんへ りょこうします。","exampleEn":"I will travel to Japan next year.","id":"11-1"},{"jp":"きょうと","en":"Kyoto","category":"place","romaji":"kyouto","example":"きょうとに おてらが たくさん あります。","exampleEn":"There are many temples in Kyoto.","id":"11-2"},{"jp":"すし","en":"sushi","category":"noun","romaji":"sushi","example":"すしを たべたことが あります。","exampleEn":"I have eaten sushi before.","id":"11-3"},{"jp":"たべた","en":"ate","category":"verb","romaji":"tabeta","example":"きのう すしを たべた。","exampleEn":"I ate sushi yesterday.","id":"11-4"},{"jp":"いった","en":"went","category":"verb","romaji":"itta","example":"せんしゅう きょうとへ いった。","exampleEn":"I went to Kyoto last week.","id":"11-5"},{"jp":"あります","en":"exist / have","category":"verb","romaji":"arimasu","example":"つくえの うえに ほんが あります。","exampleEn":"There is a book on the desk.","id":"11-6"},{"jp":"したい","en":"want to do","category":"verb","romaji":"shitai","example":"にほんへ りょこうしたいです。","exampleEn":"I want to travel to Japan.","id":"11-7"}],"mistake":"Do not use the polite past inside this pattern: たべましたことがあります is incorrect. Use plain past + ことがあります; use たべました for a dated, completed event.","dialogue":[{"who":"A","jp":"きょうとに いったことが あります。","en":"I have been to Kyoto."},{"who":"B","jp":"いいですね。おてらを みましたか。","en":"That sounds nice. Did you see the temples?"}],"responseOptions":["いいですね。おてらを みましたか。","ドアを しめてください。","この ほんは たかいです。"],"responseAnswer":0},{"id":12,"title":"At the Clinic","description":"Reasons and advice","jp":"あたまが いたいので やすんだ ほうが いいです。","en":"My head hurts, so I should rest.","rule":"ので and ほうがいい","explain":"ので connects a reason to its result: いたいので means “because it hurts.” For advice, use a plain past verb + ほうがいいです for a recommended action (やすんだほうがいいです, “you should rest”), or a plain negative verb + ほうがいいです to recommend against an action. Use this to give gentle advice, not an absolute command.","builder":["あたま","が","いたい","ので","やすんだ","ほう","が","いい","です"],"builderEn":"My head hurts, so I should rest.","vocab":[{"jp":"あたま","en":"head","category":"body","romaji":"atama","example":"あたまが いたいです。","exampleEn":"My head hurts.","id":"12-0"},{"jp":"いたい","en":"painful","category":"adjective","romaji":"itai","example":"のどが いたいです。","exampleEn":"My throat hurts.","id":"12-1"},{"jp":"びょういん","en":"hospital","category":"place","romaji":"byouin","example":"びょういんへ いきます。","exampleEn":"I am going to the hospital.","id":"12-2"},{"jp":"くすり","en":"medicine","category":"noun","romaji":"kusuri","example":"くすりを のみます。","exampleEn":"I take medicine.","id":"12-3"},{"jp":"やすみます","en":"rest","category":"verb","romaji":"yasumimasu","example":"きょうは うちで やすみます。","exampleEn":"I will rest at home today.","id":"12-4"},{"jp":"ねつ","en":"fever","category":"noun","romaji":"netsu","example":"ねつが あります。","exampleEn":"I have a fever.","id":"12-5"},{"jp":"からだ","en":"body","category":"body","romaji":"karada","example":"からだに いい たべものです。","exampleEn":"This is food that is good for your health.","id":"12-6"},{"jp":"だいじょうぶ","en":"all right","category":"phrase","romaji":"daijoubu","example":"だいじょうぶですか。","exampleEn":"Are you all right?","id":"12-7"}],"mistake":"Do not use ます-form before ほうがいい: use plain past (やすんだほうがいい) or plain negative (いかないほうがいい). For nouns and な-adjectives, use なので, not ので directly.","dialogue":[{"who":"A","jp":"あたまが いたいので やすんだ ほうが いいです。","en":"My head hurts, so I should rest."},{"who":"B","jp":"それは たいへんですね。おだいじにしてください。","en":"That sounds difficult. Please take care of yourself."}],"responseOptions":["それは たいへんですね。おだいじにしてください。","500えんです。","どんな えいがですか。"],"responseAnswer":0}], KANA=[{"ch": "あ", "r": "a", "script": "Hiragana"}, {"ch": "い", "r": "i", "script": "Hiragana"}, {"ch": "う", "r": "u", "script": "Hiragana"}, {"ch": "え", "r": "e", "script": "Hiragana"}, {"ch": "お", "r": "o", "script": "Hiragana"}, {"ch": "か", "r": "ka", "script": "Hiragana"}, {"ch": "き", "r": "ki", "script": "Hiragana"}, {"ch": "く", "r": "ku", "script": "Hiragana"}, {"ch": "け", "r": "ke", "script": "Hiragana"}, {"ch": "こ", "r": "ko", "script": "Hiragana"}, {"ch": "さ", "r": "sa", "script": "Hiragana"}, {"ch": "し", "r": "shi", "script": "Hiragana"}, {"ch": "す", "r": "su", "script": "Hiragana"}, {"ch": "せ", "r": "se", "script": "Hiragana"}, {"ch": "そ", "r": "so", "script": "Hiragana"}, {"ch": "た", "r": "ta", "script": "Hiragana"}, {"ch": "ち", "r": "chi", "script": "Hiragana"}, {"ch": "つ", "r": "tsu", "script": "Hiragana"}, {"ch": "て", "r": "te", "script": "Hiragana"}, {"ch": "と", "r": "to", "script": "Hiragana"}, {"ch": "な", "r": "na", "script": "Hiragana"}, {"ch": "に", "r": "ni", "script": "Hiragana"}, {"ch": "ぬ", "r": "nu", "script": "Hiragana"}, {"ch": "ね", "r": "ne", "script": "Hiragana"}, {"ch": "の", "r": "no", "script": "Hiragana"}, {"ch": "は", "r": "ha", "sc // JLPT N5 curriculum browser and original practice activities.
let n5Tab='overview', n5Search='', n5PageIndex=0, n5SelectedKanji=0;
let n5Question=null, n5PracticeSection='vocabulary', n5Correct=0, n5Attempted=0;
let n5Mock=null, n5MockTimer=null;

function n5Set(tab){n5Tab=tab;n5PageIndex=0;n5Question=null;render()}
function n5VocabularyList(){
 const q=n5Search.trim().toLowerCase();
 const list=N5_VOCAB.filter(w=>!q||[w.word,w.reading,w.romaji,...w.meanings].join(' ').toLowerCase().includes(q));
 const start=n5PageIndex*24, page=list.slice(start,start+24);
 return `<div class="row"><input id="n5Search" class="field" placeholder="Search word, reading, or meaning" value="${esc(n5Search)}"><button class="btn" onclick="n5Search=$('n5Search').value;n5PageIndex=0;render()">Search</button><span class="pill">${list.length} entries</span></div><p class="notice">Community example sentences are optional reading aids and may include vocabulary beyond N5; English translations are shown when available.</p><div class="wordgrid" style="margin-top:14px">${page.map(w=>`<article class="word"><div class="row between"><b class="jp">${esc(w.word)}</b><button class="btn ghost small" onclick="speak('${w.word}')">▶</button></div><div>${esc(w.reading)} · ${esc(w.romaji)}</div><p>${esc(w.meanings.join('; '))}</p>${w.examples?.[0]?`<details class="n5-example"><summary>Example sentence</summary><p class="notice jp">${esc(w.examples[0].ja)}</p>${w.examples[0].en?`<p class="notice">${esc(w.examples[0].en)}</p>`:''}${w.examples[0].tatoeba_id?`<a class="notice" href="https://tatoeba.org/en/sentences/show/${w.examples[0].tatoeba_id}" target="_blank" rel="noopener">Tatoeba sentence ${w.examples[0].tatoeba_id}</a>`:''}</details>`:''}</article>`).join('')}</div><div class="row between" style="margin-top:14px"><button class="btn secondary" ${n5PageIndex===0?'disabled':''} onclick="n5PageIndex--;render()">← Previous</button><span class="notice">${start+1}–${Math.min(start+24,list.length)} of ${list.length}</span><button class="btn secondary" ${start+24>=list.length?'disabled':''} onclick="n5PageIndex++;render()">Next →</button></div>`
}
function n5GrammarList(){
 const q=n5Search.trim().toLowerCase();
 const list=N5_GRAMMAR.filter(g=>!q||[g.pattern,g.romaji,g.meaning,g.formation,...g.tags].join(' ').toLowerCase().includes(q));
 const start=n5PageIndex*12,page=list.slice(start,start+12);
 return `<div class="row"><input id="n5Search" class="field" placeholder="Search pattern or meaning" value="${esc(n5Search)}"><button class="btn" onclick="n5Search=$('n5Search').value;n5PageIndex=0;render()">Search</button><span class="pill">${list.length} points</span></div><div class="grid">${page.map(g=>`<article class="card"><div class="eyebrow">${esc(g.tags.join(' · '))}</div><h3 class="jp">${esc(g.pattern)} <small class="muted">${esc(g.romaji)}</small></h3><b>${esc(g.meaning)}</b><p class="notice">${esc(g.formation)}</p>${g.examples?.[0]?`<p class="jp">${esc(g.examples[0].ja)}</p><p class="notice">${esc(g.examples[0].en)}</p>`:''}${g.notes?`<details><summary>Usage note</summary><p>${esc(g.notes)}</p></details>`:''}</article>`).join('')}</div><div class="row between"><button class="btn secondary" ${n5PageIndex===0?'disabled':''} onclick="n5PageIndex--;render()">← Previous</button><span class="notice">${start+1}–${Math.min(start+12,list.length)} of ${list.length}</span><button class="btn secondary" ${start+12>=list.length?'disabled':''} onclick="n5PageIndex++;render()">Next →</button></div>`
}
function n5KanjiList(){
 const k=N5_KANJI[n5SelectedKanji];
 return `<div class="kana-grid">${N5_KANJI.map((x,i)=>`<button class="kana" onclick="n5SelectedKanji=${i};render()"><strong>${x.character}</strong><small>${esc(x.meanings[0])} · ${x.strokes} strokes</small></button>`).join('')}</div><article class="card" style="margin-top:14px"><div class="row between"><div><div class="bigjp jp" style="margin:0">${k.character}</div><h2>${esc(k.meanings.join(' / '))}</h2><p><b>On:</b> ${esc(k.onyomi.join(' · ')||'—')} · <b>Kun:</b> ${esc(k.kunyomi.join(' · ')||'—')}</p><p><b>Stroke count:</b> ${k.strokes} · <b>Example words:</b> ${esc(k.words.slice(0,5).join('、'))}</p><button class="btn" onclick="practiceScript='Kanji';practiceIndex=KANJI.findIndex(x=>x.ch==='${k.character}');nav('handwriting')">Practice writing →</button></div><div>${strokeOrderSvg(k.character)}</div></div></article>`
}
function n5Practice(){
 const sec=n5PracticeSection;
 return `<div class="tabs">${[['vocabulary','Vocabulary'],['grammar','Grammar'],['reading','Reading'],['listening','Listening']].map(x=>`<button class="tab ${sec===x[0]?'active':''}" onclick="n5PracticeSection='${x[0]}';n5Question=null;render()">${x[1]}</button>`).join('')}</div><div class="card"><div class="row between"><div><h2>${sec[0].toUpperCase()+sec.slice(1)} practice</h2><p class="notice">Original practice items modeled on JLPT N5 question formats.</p></div><span class="pill">${n5Correct}/${n5Attempted} correct</span></div>${n5Question?`<div class="feedback"><b>${esc(n5Question.type)}</b></div>${n5Question.audio?`<button class="btn secondary" onclick="speak(n5Question.audio)">▶ Play listening prompt</button>`:''}${n5Question.text?`<div class="word jp" style="white-space:pre-line">${esc(n5Question.text)}</div>`:''}<p>${esc(n5Question.prompt)}</p>${n5Question.options.map((o,i)=>`<button class="option" ${n5Question.answered?'disabled':''} onclick="answerN5Question(${i})">${esc(o)}</button>`).join('')}${n5Question.answered?`<div class="feedback ${n5Question.correct===n5Question.selected?'good':'bad'}">${n5Question.correct===n5Question.selected?'Correct.':'Answer: '+esc(n5Question.options[n5Question.correct])}</div>`:''}<button class="btn" onclick="newN5Question('${sec}')">${n5Question.answered?'Next question':'New question'}</button>`:`<p>Practice the N5 ${esc(sec)} section. Questions are original and not taken from JLPT exams.</p><button class="btn" onclick="newN5Question('${sec}')">Start practice</button>`}</div>`
}
function buildN5Question(section,forced=null,forcedType=null){
 let q,question;
 if(section==='reading'){
  q=forced||N5_READINGS[Math.floor(Math.random()*N5_READINGS.length)];question={...q,type:q.type,prompt:q.question,correct:q.answer};
 }else if(section==='listening'){
  q=forced||N5_LISTENING[Math.floor(Math.random()*N5_LISTENING.length)];question={...q,prompt:q.question,correct:q.answer};
 }else if(section==='grammar'){
  if(forced){q=forced;question={type:q.type,text:q.text,prompt:'Choose the answer that makes a natural sentence or passage.',options:q.options,correct:q.answer}}else if(Math.random()<.65){q=Math.random()<.5?N5_GRAMMAR_FORM_ITEMS[Math.floor(Math.random()*N5_GRAMMAR_FORM_ITEMS.length)]:N5_TEXT_FLOW_ITEMS[Math.floor(Math.random()*N5_TEXT_FLOW_ITEMS.length)];question={type:q.type,text:q.text,prompt:'Choose the answer that makes a natural sentence or passage.',options:q.options,correct:q.answer}}else{q=N5_GRAMMAR[Math.floor(Math.random()*N5_GRAMMAR.length)];const options=[q,...shuffle(N5_GRAMMAR.filter(x=>x.id!==q.id)).slice(0,3)];const shuffled=shuffle(options);question={type:'Grammar point · choose the meaning',prompt:`What does ${q.pattern} express?`,options:shuffled.map(x=>x.meaning),correct:shuffled.indexOf(q)}}
 }else{
  q=forced||N5_VOCAB[Math.floor(Math.random()*N5_VOCAB.length)];const type=forcedType??Math.floor(Math.random()*4),pool=shuffle(N5_VOCAB.filter(x=>x.id!==q.id));let answer,prompt,text='';
  if(type===0){answer=q.reading;prompt=`Choose the reading of ${q.word}.`}
  else if(type===1){answer=q.word;prompt=`Which spelling matches ${q.reading}?`}
  else if(type===2){answer=q.meanings[0];text=q.examples?.[0]?.ja||q.word;prompt='Choose the meaning that best fits this expression.'}
  else{answer=q.meanings[0];prompt=`Choose the closest meaning for ${q.word} (${q.reading}).`}
  const raw=[answer,...pool.map(x=>type===0?x.reading:type===1?x.word:x.meanings[0])].filter((x,i,a)=>x&&a.indexOf(x)===i).slice(0,4);
  const options=shuffle(raw);question={type:['Kanji reading','Orthography','Contextually-defined expression','Paraphrase'][type],prompt,text,options,correct:options.indexOf(answer)};
 }
 return {...question,answered:false,selected:-1};
}
function newN5Question(section){n5Question=buildN5Question(section);render()}
function answerN5Question(i){if(!n5Question||n5Question.answered)return;n5Question.selected=i;n5Question.answered=true;n5Attempted++;if(i===n5Question.correct)n5Correct++;render()}
function n5Page(){
 const tabs=[['overview','Overview'],['vocabulary','Vocabulary'],['grammar','Grammar'],['kanji','Kanji'],['practice','Practice'],['mock','Timed mock']];
 let body;
 if(n5Tab==='vocabulary')body=n5VocabularyList();
 else if(n5Tab==='grammar')body=n5GrammarList();
 else if(n5Tab==='kanji')body=n5KanjiList();

(function exposeCourseContentValidator(root) {
  function validateCourseContent(lessons, wordGuidance = {}) {
    const errors = [];
    if (!Array.isArray(lessons)) return ['Lessons must be an array'];
    const lessonIds = new Set();
    const wordIds = new Set();

    for (const lesson of lessons) {
      const id = lesson?.id;
      if (!Number.isInteger(id) || id < 1) errors.push(`Invalid lesson id ${String(id)}`);
      else if (lessonIds.has(id)) errors.push(`Duplicate lesson id ${id}`);
      else lessonIds.add(id);

      for (const field of ['title', 'description', 'jp', 'en', 'rule', 'explain', 'builderEn', 'mistake']) {
        if (typeof lesson?.[field] !== 'string' || !lesson[field].trim()) errors.push(`Missing ${field} lesson ${String(id)}`);
      }
      if (!Array.isArray(lesson?.builder) || !lesson.builder.length || lesson.builder.some(part => typeof part !== 'string' || !part.trim())) errors.push(`Invalid builder lesson ${String(id)}`);
      if (!Array.isArray(lesson?.vocab) || !lesson.vocab.length) errors.push(`Invalid vocab lesson ${String(id)}`);
      if (!Array.isArray(lesson?.dialogue) || !lesson.dialogue.some(line => line?.who === 'A') || !lesson.dialogue.some(line => line?.who === 'B')) errors.push(`Invalid dialogue lesson ${String(id)}`);
      if (!Array.isArray(lesson?.responseOptions) || lesson.responseOptions.length !== 3 || new Set(lesson.responseOptions).size !== 3) errors.push(`Invalid response options lesson ${String(id)}`);
      if (!Number.isInteger(lesson?.responseAnswer) || lesson.responseAnswer < 0 || lesson.responseAnswer >= (lesson.responseOptions?.length || 0)) errors.push(`Invalid response answer lesson ${String(id)}`);
      else if (lesson.responseOptions?.[lesson.responseAnswer] !== lesson.dialogue?.find(line => line.who === 'B')?.jp) errors.push(`Response answer does not match Speaker B lesson ${String(id)}`);

      for (const word of Array.isArray(lesson?.vocab) ? lesson.vocab : []) {
        if (typeof word?.id !== 'string' || !word.id.trim()) errors.push(`Missing word id lesson ${String(id)}`);
        else if (wordIds.has(word.id)) errors.push(`Duplicate word id ${word.id}`);
        else wordIds.add(word.id);
        for (const field of ['jp', 'en', 'romaji', 'example', 'exampleEn']) {
          if (typeof word?.[field] !== 'string' || !word[field].trim()) errors.push(`Missing ${field} ${word?.id || String(id)}`);
        }
        const headword = typeof word?.jp === 'string' ? word.jp.replace(/\s/g, '') : '';
        const example = typeof word?.example === 'string' ? word.example.replace(/\s/g, '') : '';
        if (headword && !example.includes(headword)) errors.push(`Example does not include ${word.id || word.jp}`);
        if (typeof word?.jp === 'string' && (typeof wordGuidance[word.jp] !== 'string' || !wordGuidance[word.jp].trim())) errors.push(`Missing usage guidance ${word.jp}`);
      }
    }
    return errors;
  }

  function validateProgressBackupSettings(state) {
    const errors = [];
    if (!state || typeof state !== 'object' || Array.isArray(state)) return ['Invalid state'];
    if (!Number.isSafeInteger(state.xp) || state.xp < 0) errors.push('Invalid XP value');
    if (state.goal !== undefined && (!Number.isSafeInteger(state.goal) || state.goal < 1 || state.goal > 200)) {
      errors.push('Invalid daily goal');
    }
    return errors;
  }

  function sanitizeStoredProgressSettings(state, defaults = { goal: 15, xp: 0 }) {
    const errors = validateProgressBackupSettings(state);
    if (errors.includes('Invalid XP value')) state.xp = defaults.xp;
    if (errors.includes('Invalid daily goal')) state.goal = defaults.goal;

'かぞく':'Use 家族 for family, often your own family. When referring politely to someone else’s family, use ご家族 (ごかぞく), not お家族.',
'やさい':'Use for vegetables as food or a category. It often combines with をたべます; count specific items with counters, not this general noun.',
'にく':'Use for meat. Specify the type before it (ぶたにく pork, とりにく chicken); it commonly takes を with cooking/eating verbs.',
'おいしい':'Use to say food or drink tastes good. It is an い-adjective; do not add の between it and the noun (おいしいりょうり).',
'おもいます':'Polite form of おもう (“think”). A thought or opinion is commonly followed by と: おいしいとおもいます.',
'いいます':'Polite form of いう (“say”). Quote the words with と: 「こんにちは」といいます; a person can be marked with に.',
'たのしい':'Use for an enjoyable experience or activity. Describe an event with は/がたのしいです; it is not usually used to describe a person as “funny.”',
'しゅうまつ':'Use for the weekend. It commonly appears without a particle as a time phrase: しゅうまつに (on the weekend) is also natural.',
'りょうり':'Use for cooking or a prepared dish/cuisine. りょうりをします means cook; りょうりをたべます means eat a dish.',
'みた':'Plain past form of みる (“saw/watched”). Use in casual speech or before a noun/clause; polite past is みました.',
'きいた':'Plain past of きく, which means “heard/listened” or “asked” depending on context. 〜をきいた often means heard; person にきいた means asked someone.',
'ながい':'Use for physical length or duration (a long road, long time). It is an い-adjective; its opposite is みじかい.',
'みじかい':'Use for physical shortness or brief duration. It commonly describes hair, distance, or time; its opposite is ながい.',
'げき':'Use for a play or drama performed on stage. げきをみる means watch a play; it differs from a movie (えいが).',
'ぶたい':'Use for a stage or performance platform. にあがる means go up onto the stage; で marks an event happening on stage.',
'おもしろい':'Use for something interesting or entertaining. It describes a topic, book, or film; it is an い-adjective and can be positive or context-dependent.',
'でんしゃ':'Use for a train, especially an electric railway train. でんしゃで行く uses で to mark the means of transport.',
'バス':'Use for a bus. Say バスで行きます (“go by bus”); use に乗ります for getting on a bus.',
'はやい':'Use for fast speed or an early time. It has two common senses; context distinguishes “fast” from “early.”',
'おそい':'Use for slow speed or a late time. Context distinguishes “slow” from “late”; it is not the same as “quiet.”',
'より':'Use after the comparison baseline: AはBよりたかいです (“A is more expensive than B”). The compared item is marked with は or が.',
'ふゆ':'Use for winter, usually as a time/topic phrase. ふゆに marks “in winter”; seasonal nouns generally do not need an article.',
'やすみ':'Use for a day off, holiday, or break. やすみです means “is off/on break”; やすみをとる means take time off.',
'よてい':'Use for a plan or schedule. 〜のよてい means “plans for …”; 予定があります means having plans.',
'けいけん':'Use for experience or something experienced. けいけんがあります means “have experience”; けいけんする means experience something.',
'りょこう':'Use for a trip or travel. りょこうにいく means go on a trip; りょこうをする also means travel.',
'きょうと':'Use as the place name Kyoto. に marks going to/being in Kyoto; で marks an action done there.',
'すし':'Use for sushi. It is often a mass/category noun; すしをたべます means eat sushi.',
'たべた':'Plain past form of たべる (“ate”). Use in casual conversation or before a noun/clause; polite past is たべました.',
'いった':'Plain past form of いく (“went”). Use に/へ for the destination; polite past is いきました.',
'あります':'Use for existence of things, not people/animals, and for possession. A thing takes が and its location takes に; possession often uses Xがあります.',
'したい':'Attach to a verb stem to say “want to do”: りょこうしたいです. The desired activity is often marked with を or が; it describes the speaker’s wish.',
'あたま':'Use for a person’s head or mind. For pain, say あたまがいたいです (“my head hurts”), with が marking the part that hurts.',
'いたい':'Use for physical pain or soreness. Mark the painful body part with が: のどがいたいです; it is an い-adjective.',
'びょういん':'Use for a hospital or clinic. に marks going to/being at the hospital; で marks treatment or an action happening there.',
'くすり':'Use for medicine or medication. くすりをのみます (“take medicine”) is the usual verb even for pills; follow dosage instructions.',
'やすみます':'Polite form of やすむ (“rest/take a day off”). Use に for the time and から for a reason; it can mean sleep/rest or be absent.',
'ねつ':'Use for a fever/raised temperature. ねつがあります means “have a fever”; say ねつがたかい for a high fever.',
'からだ':'Use for the body or physical health. からだにいい means good for the body/health; it is broader than a specific body part.',
'だいじょうぶ':'Use to ask or say whether someone is okay, something is safe, or a situation is fine. だいじょうぶですか is a caring check-in; context determines the sense.'
};

function handwriting(){let pool=practicePool(),item=pool[practiceIndex%pool.length],done=state.handwriting||{};return `${header('Handwriting practice','Learn each character in stages: hiragana, katakana, then 84 approximate N5 kanji. Draw with your finger, mouse, or stylus.','WRITE JAPANESE')}<div class="row"><button class="btn ${practiceScript==='Hiragana'?'':'secondary'}" onclick="practiceScript='Hiragana';practiceIndex=0;clearCanvas();render()">Hiragana</button><button class="btn ${practiceScript==='Katakana'?'':'secondary'}" onclick="practiceScript='Katakana';practiceIndex=0;clearCanvas();render()">Katakana</button><button class="btn ${practiceScript==='Kanji'?'':'secondary'}" onclick="practiceScript='Kanji';practiceIndex=0;clearCanvas();render()">Beginner kanji</button><span class="pill">${Object.keys(done).filter(x=>x.startsWith(practiceScript+':')).length} practiced</span></div><div class="card handwriting-card" style="margin-top:18px"><div class="row between"><div><div class="eyebrow">${practiceScript} · ${practiceIndex%pool.length+1} of ${pool.length}</div><div class="bigjp jp" style="font-size:72px;margin:0">${item.ch}</div><b>${esc(item.r)} · ${esc(item.meaning)}</b></div><div class="notice">Reference character<br><span class="jp" style="font-size:52px;color:#bd637c">${item.ch}</span></div></div><p class="notice practice-hint">Trace the model, then try writing it from memory. Freehand practice is not automatically graded.</p><div class="practice-workspace"><div class="card stroke-card" style="margin:16px 0"><div class="row between"><div><h3 style="margin:0">Correct stroke order</h3><p id="strokeStepLabel" class="notice">Ready · ${STROKES[item.ch].length} strokes</p></div><div class="row"><button id="strokePlay" class="btn" onclick="playStrokeOrder()">▶ Play order</button><button class="btn secondary" onclick="strokePrev()">← Step</button><button class="btn secondary" onclick="strokeNext()">Step →</button></div></div><div id="strokeGuide" style="text-align function setupPracticeCanvas(){let c=$('practiceDraw');if(!c)return;let ctx=c.getContext('2d'),drawing=false,points=[];ctx.strokeStyle='#252e59';ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';const pos=e=>{let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{drawing=true;points=[];c.setPointerCapture(e.pointerId);let p=pos(e);points.push(p);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;let p=pos(e);points.push(p);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>{if(drawing&&points.length){practiceUndo.push(points);drawing=false}}}

function newAssessment(l){let words=shuffle(l.vocab);return {questionTypes:shuffle([...ASSESSMENT_TYPES]),wordIds:words.slice(0,2).map(w=>w.id),results:[],passed:false}}

function makeQuiz(l){let run=assessmentRun(l),index=run.results.length,type=run.questionTypes[index],words=id=>l.vocab.find(w=>w.id===id)||l.vocab[0],chosen=(type==='writing'?words(run.wordIds[1]):words(run.wordIds[0])),otherLessons=LESSONS.filter(x=>x.id!==l.id),options=(correct,candidates)=>shuffle([correct,...shuffle([...new Set(candidates.filter(x=>x!==correct))]).slice(0,3)]);quiz={type,index,typed:false,options:[],jp:'',prompt:'',correct:'',explanation:''};if(type==='vocabulary'){quiz.jp=chosen.jp;quiz.prompt=`What does ${chosen.jp} mean?`;quiz.correct=chosen.en;quiz.options=options(quiz.correct,l.vocab.map(w=>w.en));quiz.explanation=`${chosen.jp} = ${chosen.en}.`}else if(type==='grammar'){quiz.prompt=`Which Japanese sentence means “${l.builderEn}”?`;quiz.correct=l.builder.join(' ');quiz.options=options(quiz.correct,otherLessons.map(x=>x.builder.join(' ')));quiz.explanation=`${quiz.correct} = ${l.builderEn}.`}else if(type==='dialogue'){let line=l.dialogue.find(d=>d.who==='A')||l.dialogue[0];quiz.jp=line.jp;quiz.prompt='What does Speaker A say?';quiz.correct=line.en;quiz.options=options(quiz.correct,otherLessons.map(x=>(x.dialogue.find(d=>d.who==='A')||x.dialogue[0]).en));quiz.explanation=`${line.jp} = ${line.en}.`}else if(type==='listening'){quiz.jp=l.jp;quiz.prompt='Listen to the Japanese, then choose its meaning.';quiz.correct=l.en;quiz.options=options(quiz.correct,otherLessons.map(x=>x.en));quiz.explanation=`${l.jp} = ${l.en}.`}else{quiz.prompt=`Type the Japanese for “${chosen.en}”.`;quiz.correct=chosen.jp;quiz.typed=true;quiz.jp=chosen.jp;quiz.explanation=`${chosen.jp} = ${chosen.en}.`}quizAnswered=false;quizLesson=l.id;showQuizText=false;feedback='';return quiz}
function retryAssessment(id){let l=LESSONS[id-1];if(!l)return;state.assessments[id]=newAssessment(l);quiz=null;quizAnswered=false;quizLesson=id;feedback='';save();makeQuiz(l);render()}
function assessment(l){let run=assessmentRun(l),score=run.results.filter(Boolean).length;if(run.passed)return `<div class="card"><div class="eyebrow">ASSESSMENT PASSED</div><h2>Lesson assessment complete</h2><div class="stat">${score} / 5</div><p>You passed with at least 4 correct answers across vocabulary, grammar, dialogue, listening, and writing.</p></div>`;if(run.results.length>=5)return `<div class="card"><div class="eyebrow">ASSESSMENT RESULT</div><h2>Try the assessment again</h2><div class="stat">${score} / 5</div><p>You need 4 correct answers to pass. Review the lesson and try a fresh set.</p><button class="btn" onclick="retryAssessment(${l.id})">Retry assessment</button></div>`;if(!quiz||quizLesson!==l.id||(quiz.index!==run.results.length&&!(quizAnswered&&quiz.index+1===run.results.length)))makeQuiz(l);let q=quiz,number=q.index+1,body=q.type==='listening'?`<div class="row"><button class="btn" onclick="speak('${q.jp}')">▶ Play Japanese</button><button class="btn secondary" onclick="showQuizText=!showQuizText;render()">${showQuizText?'Hide':'Show'} text</button></div>${showQuizText?`<p class="jp" style="font-size:24px">${esc(q.jp)}</p>`:''}${q.options.map(x=>`<button class="option" ${quizAnswered?'disabled':''} onclick="checkQuiz(this.textContent)">${esc(x)}</button>`).join('')}`:q.typed?`<p>${esc(q.prompt)}</p><input class="field" id="quizInput" lang="ja" autocomplete="off" ${quizAnswered?'disabled':''}><button class="btn" ${quizAnswered?'disabled':''} onclick="checkQuiz($('quizInput').value,true)">Check</button>`:`<p>${esc(q.prompt)}</p>${q.type==='dialogue'?`<p class="jp" style="font-size:27px">${esc(q.jp)}</p>`:''}${q.options.map(x=>`<button class="option ${q.type==='grammar'?'jp':''}" ${quizAnswered?'disabled':''} onclick="checkQuiz(this.textContent)">${esc(x)}</button>`).join('')}`;return `<div class="card"><div class="row between"><h2>Lesson assessment</h2><span class="pill">Question ${number} of 5 · ${score} correct</span></div><p>Five questions cover function checkQuiz(v,typed=false){if(quizAnswered||quizLesson!==lessonId||!quiz)return;let run=assessmentRun(LESSONS[lessonId-1]);if(quiz.index!==run.results.length)return;let ok=quiz.typed?typed&&norm(v)===norm(quiz.correct):!typed&&String(v)===quiz.correct;quizAnswered=true;feedback=(ok?'Correct! ':'Not quite. ')+quiz.explanation;state.answers.push({lesson:lessonId,format:'assessment-'+quiz.type,correct:ok,date:today()});run.results.push(ok);if(run.results.length===5)run.passed=run.results.filter(Boolean).length>=4;if(ok)reward(10);save();render()}

function newKanaQuiz(){let pool=KANA.filter(x=>x.script===kanaScript&&!x.extra),k=pool[Math.floor(Math.random()*pool.length)];kanaQuiz={ch:k.ch,r:k.r,options:shuffle([k.r,...shuffle([...new Set(pool.map(x=>x.r).filter(r=>r!==k.r))]).slice(0,3)])};feedback='';render()}
function kanaAnswer(r){let ok=r===kanaQuiz.r;feedback=ok?'Correct! '+kanaQuiz.ch+' = '+r:'Incorrect. '+kanaQuiz.ch+' = '+kanaQuiz.r;if(ok){if(!state.kana[kanaQuiz.ch]){state.kana[kanaQuiz.ch]=true;rewardOnce('kana:'+kanaQuiz.ch,4)}if(challengeEnd&&Date.now()<challengeEnd)challengeScore++}else activity();save();if(challengeEnd&&Date.now()>challengeEnd){feedback+=' · Time is up! Score: '+challengeScore;challengeEnd=0}kanaQuiz=null;render()}
function startTimer(){challengeEnd=Date.now()+60000;challengeScore=0;newKanaQuiz();let interval=setInterval(()=>{let el=$('timerLabel');if(!el||!challengeEnd){clearInterval(interval);return}let n=Math.max(0,Math.ceil((challengeEnd-Date.now())/1000));el.textContent=n+' seconds left';if(!n){challengeEnd=0;clearInterval(interval);el.textContent='Time up · '+challengeScore+' correct'}},250)}
function kanjiPage(){let k=KANJI[kanjiIndex];return `${header('Kanji explorer','84 approximate N5 kanji with meanings, readings, examples, and stroke order.','FOUNDATIONS')}<div class="kana-grid">${KANJI.map((x,i)=>`<button class="kana" onclick="kanjiIndex=${i};render()"><strong>${x.ch}</strong><small>${state.kanji[x.id]?'✓ ':''}${esc(x.meaning.split(' / ')[0])}</small></button>`).join('')}</div><div class="card" style="margin-top:20px"><div class="bigjp jp">${k.ch}</div><h2>${esc(k.meaning)}</h2><p><b>On’yomi:</b> ${esc(k.on)}</p><p><b>Kun’yomi:</b> ${esc(k.kun)}</p><p><b>Example:</b> ${esc(k.example)}</p><button class="btn secondary" onclick="speak('${k.ch}')">▶ Listen</button> <button class="btn" onclick="if(!state.kanji['${k.id}']){state.kanji['${k.id}']=true;rewardOnce('kanji:${k.id}',5)}render()">${state.kanji[k.id]?'✓ Studied':'Mark studied'}</button></div><p class="notice">Readings are common beginner readings, not exhaustive. Some examples use a reading that applies to the whole compound.</p>`}
function settings(){return `${header('Learning settings & backup','Your data lives in this browser. Export regularly to avoid losing it when clearing site data.','PREFERENCES')}<div class="card"><label class="toggle"><input type="checkbox" ${romaji?'checked':''} onchange="romaji=this.checked;render()"> Show romaji in vocabulary</label><p><label>Daily activity goal <input class="field" type="number" min="1" max="200" value="${state.goal}" onchange="state.goal=Math.max(1,Math.min(200,Number(this.value)||15));save()"></label></p><div class="row"><button class="btn" onclick="exportData()">Export progress JSON</button><label class="btn secondary" for="importFile">Import progress JSON</label><input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="importData(this.files[0])"></div><p class="notice">Import replaces current progress. Review JSON before importing files from others. Data is not uploaded anywhere.</p><div class="divider"></div><button class="btn secondary" onclick="if(confirm('Delete all local learning progress?')){state=fresh();save();render()}">Reset progress</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sakura-academy-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{if(file.size>2000000)throw Error('Backup too large');let d=JSON.parse(await file.text()),s=d.state;if(d.version!==1||!s||typeof s!=='object'||Array.isArray(s)||!Array.isArray(s.answers)||typeof s.xp!=='number')throw Error('Invalid backup structure');for(let k of ['reviews','learned','completed','activity','kana','kanji','handwriting'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error('Invalid '+k);if(s.assessments!==undefined&&(!s.assessments||typeof s.assessments!=='object'||Array.isArray(s.assessments)))throw Error('Invalid assessments');if(s.rewarded!==undefined&&(!s.rewarded||typeof s.rewarded!=='object'||Array.isArray(s.rewarded)))throw Error('Invalid rewarded');if(s.tabVisits!==undefined&&(!s.tabVisits||typeof s.tabVisits!=='object'||Array.isArray(s.tabVisits)))throw Error('Invalid tab visits');if(s.strictMode!==undefined&&typeof s.strictMode!=='boolean')throw Error('Invalid strictMode');let settingsErrors=validateProgressBackupSettings(s);if(settingsErrors.length)throw Error(settingsErrors.join(', '));if(!confirm('Replace all current progress with this backup?'))return;state={...fresh(),...s};save();render();alert('Backup imported.')}catch(e){alert('Import failed: '+e.message)}}
function render(){let items=[['dashboard','◈','Dashboard','Home'],['n5','五','JLPT N5','N5'],['lessons','▤','Lessons','Lessons'],['kana','あ','Kana studio','Kana'],['handwriting','✎','Write characters','Write'],['kanji','字','Kanji explorer','Kanji'],['flashcards','◇','Flashcards','Cards'],['settings','⚙','Settings','Settings']];$('sidebar').innerHTML=`<div class="brand"><span class="brandmark">✿</span><span><strong>Sakura Academy</strong><small>日本語を学ぼう</small></span></div><button class="navbtn" onclick="$('sidebar').classList.toggle('collapsed')"><span class="glyph">☰</span><span class="navtext">Collapse menu</span></button>${items.map(x=>`<button class="navbtn ${view===x[0]||(view==='lesson'&&x[0]==='lessons')?'active':''}" aria-label="${x[2]}" onclick="nav('${x[0]}')"><span class="glyph">${x[1]}</span><span class="navtext" data-mobile="${x[3]}">${x[2]}</span></button>`).join('')}`;$('content').innerHTML=({dashboard,lessons:()=>header('Lesson library','Original beginner lessons. Select a lesson to explore its learning modes.')+(strictNotice?`<div class="feedback bad">${esc(strictNotice)}</div>`:'')+(state.strictMode?`<p class="notice">Strict mode is on. Complete Lesson ${strictUnlockedLesson()} to unlock the next lesson.</p>`:'')+lessonCards(),lesson,kana:kanaPage,handwriting,kanji:kanjiPage,n5:n5Page,flashcards,settings})[view]();if(view==='lesson'&&tab==='writing')setupCanvas();if(view==='handwriting'){setupPracticeCanvas();strokeStep=0;stopStrokeGuide();showStrokeStep(0)}}
function validate(){return validateCourseContent(LESSONS,WORD_GUIDANCE)}
window.addEventListener('error',e=>console.error('App error',e.message));console.info('Content validation:',validate().length?validate():'PASS',LESSONS.length,'lessons',allCards().length,'words',KANA.length,'kana',KANJI.length,'kanji');render();

</script><script>if('serviceWorker' in navigator&&/\/sakura-academy\/(?:index\.html)?$/.test(location.pathname))navigator.serviceWorker.register('./sw.js').catch(()=>console.warn('Offline cache could not be enabled.'));</script></body></html>
