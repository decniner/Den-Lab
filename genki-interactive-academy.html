function dashboard(){let total=LESSONS.reduce((s,l)=>s+l.vocab.length,0),learned=Object.keys(state.learned).filter(k=>state.learned[k]).length,completed=Object.values(state.completed).filter(Boolean).length,acc=percent(state.answers.filter(x=>x.correct).length,state.answers.length),dueCount=allCards().filter(c=>due(state.reviews[c.id])).length;let days=Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(13-i));return {d:d.toLocaleDateString('en-CA'),n:state.activity[d.toLocaleDateString('en-CA')]||0}});let max=Math.max(1,...days.map(x=>x.n));return `<div class="hero"><svg class="lesson-svg" viewBox="0 0 270 220" aria-hidden="true"><circle cx="175" cy="90" r="67" fill="#f4c7d2"/><path d="M45 175 Q130 85 240 175" fill="none" stroke="#333d6b" stroke-width="9" stroke-linecap="round"/><path d="M120 170 V65 M120 100 L80 70 M120 85 L155 45" stroke="#775f70" stroke-width="7" fill="none"/><g fill="#e89cb3"><circle cx="80" cy="70" r="18"/><circle cx="155" cy="45" r="19"/><circle cx="120" cy="65" r="16"/><circle cx="60" cy="110" r="10"/></g></svg>${header('Your Japanese journey starts here.','Learn with original dialogues, interactive grammar, vocabulary reviews and daily practice.','SAKURA • BEGINNER ACADEMY')}<button class="btn" onclick="goLesson(${Math.min(12,completed+1)})">Continue learning →</button></div><div class="grid">${[['Lessons complete',completed+'/12'],['Vocabulary learned',learned+'/'+total],['Quiz accuracy',acc+'%'],['Reviews due',dueCount],['Learning streak',streak()+' days'],['Experience',state.xp+' XP']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><h2 class="section">Your study activity</h2><div class="card"><div class="row between"><span>Last 14 days · recorded learning actions</span><span class="pill">Daily goal ${state.goal} actions</span></div><div class="chart" aria-label="Daily activity chart">${days.map(x=>`<div title="${x.d}: ${x.n} actions" style="height:${Math.max(3,100*x.n/max)}%"></div>`).join('')}</div><p class="notice">Readiness estimate: ${Math.round((completed/12*.45+learned/total*.25+Object.keys(state.kana).length/KANA.length*.15+Object.keys(state.kanji).length/KANJI.length*.15)*100)}% curriculum coverage, not a JLPT score or proficiency certification.</p></div><h2 class="section">Your 12 learning paths</h2>${lessonCards()}`}
function lessonCards(){return `<div class="grid">${LESSONS.map(l=>`<div class="card lesson-card"><div class="row between"><span class="lessonnum">LESSON ${String(l.id).padStart(2,'0')}</span>${state.completed[l.id]?'✓ Completed':''}</div><h3>${esc(l.title)}</h3><div class="muted">${esc(l.description)}</div><div class="jp">${esc(l.jp)}</div><div class="progress"><div style="width:${state.completed[l.id]?100:percent(l.vocab.filter(w=>state.learned[w.id]).length,l.vocab.length)}%"></div></div><p><button class="btn small" onclick="goLesson(${l.id})">Open lesson →</button></p></div>`).join('')}</div>`}
function lesson(){let l=LESSONS[lessonId-1],tabs=[['vocab','Vocabulary'],['grammar','Grammar lab'],['dialogue','Conversation'],['builder','Sentence builder'],['listening','Listening'],['writing','Writing'],['quiz','Assessment']];return `<div class="row between"><button class="btn ghost small" onclick="nav('lessons')">← All lessons</button><span class="pill">LESSON ${l.id} / 12</span></div>${header(esc(l.title),esc(l.description),'INTERACTIVE LESSON')}<div class="card"><div class="bigjp jp">${esc(l.jp)}</div><div>${esc(l.en)}</div><div class="row" style="margin-top:12px"><button class="btn secondary small" onclick="speak(LESSONS[lessonId-1].jp)">▶ Listen</button><button class="btn ghost small" onclick="romaji=!romaji;render()">${romaji?'Hide':'Show'} romaji</button></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${tab===t[0]?'active':''}" onclick="tab='${t[0]}';feedback='';render()">${t[1]}</button>`).join('')}</div>${({vocab:vocabulary,grammar:grammar,dialogue:dialogue,builder:sentenceBuilder,listening:listening,writing:writing,quiz:assessment})[tab](l)}${speechStatus?`<p class="notice">${esc(speechStatus)}</p>`:''}<div class="divider"></div><div class="row between"><button class="btn secondary" onclick="goLesson(${Math.max(1,lessonId-1)})" ${lessonId===1?'disabled':''}>← Previous</button><button class="btn" onclick="completeLesson()">${state.completed[lessonId]?'✓ Lesson completed':'Mark lesson complete'}</button><button class="btn secondary" onclick="goLesson(${Math.min(12,lessonId+1)})" ${lessonId===12?'disabled':''}>Next →</button></div>`}
function completeLesson(){if(!state.completed[lessonId]){state.completed[lessonId]=true;reward(30)}render()}
function vocabulary(l){let cats=[...new Set(l.vocab.map(w=>w.category))],list=l.vocab.filter(w=>(filter==='all'||w.category===filter)&&(w.jp.includes(search)||w.en.toLowerCase().includes(search.toLowerCase())));return `<div class="row between"><input class="field" aria-label="Search vocabulary" placeholder="Search Japanese or English" value="${esc(search)}" oninput="search=this.value;updateWords()"><select class="field" aria-label="Vocabulary category" onchange="filter=this.value;updateWords()"><option value="all">All categories</option>${cats.map(c=>`<option ${filter===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="wordList">${wordCards(list)}</div>`}
function updateWords(){let l=LESSONS[lessonId-1];$('wordList').innerHTML=wordCards(l.vocab.filter(w=>(filter==='all'||w.category===filter)&&(w.jp.includes(search)||w.en.toLowerCase().includes(search.toLowerCase()))))}
function wordCards(list){return `<div class="wordgrid" style="margin-top:16px">${list.map(w=>`<div class="word"><div class="row between"><span class="muted">${esc(w.category)}</span><button class="btn ghost small" aria-label="Hear ${esc(w.jp)}" onclick="speak('${w.jp}')">▶</button></div><div class="jp">${esc(w.jp)}</div>${romaji?`<small>${esc(w.romaji)}</small>`:''}<p><b>${esc(w.en)}</b></p><p class="notice jp">${esc(w.example)}</p><p class="notice">${esc(w.exampleEn)}</p><button class="btn small ${state.learned[w.id]?'secondary':''}" onclick="learn('${w.id}')">${state.learned[w.id]?'✓ Learned':'Mark learned'}</button></div>`).join('')}</div>`}
function learn(id){if(!state.learned[id]){state.learned[id]=true;reward(5)}else state.learned[id]=false;save();render()}
function grammar(l){return `<div class="card"><span class="eyebrow">PATTERN & MEANING</span><h2>${esc(l.rule)}</h2><p>${esc(l.explain)}</p><h3 class="jp">${esc(l.jp)}</h3><p>${esc(l.en)}</p><p class="muted">Tap a component to inspect it:</p><div class="grammar-parts">${l.builder.map((x,i)=>`<button class="token" onclick="inspect(${i})">${esc(x)}</button>`).join('')}</div><div id="inspect" class="feedback">Each tile represents a word or grammatical unit. The complete example below shows the target order.</div><p class="notice">Common mistake: ${esc(l.mistake)}</p><button class="btn" onclick="tab='builder';render()">Practice sentence structure →</button></div>`}
function inspect(i){let l=LESSONS[lessonId-1],x=l.builder[i],w=l.vocab.find(w=>w.jp===x);$('inspect').textContent=x+' · '+(w?w.en:({'は':'topic marker (pronounced wa)','を':'direct-object marker','に':'destination / time / location marker','が':'subject marker','です':'polite copula','より':'comparison baseline','ください':'polite request','と':'quotation marker'}[x]||'Grammatical unit. Observe its position in the complete sentence.'))}
function dialogue(l){return `<div class="card"><h2>In context: a short exchange</h2>${l.dialogue.map(d=>`<div class="feedback"><b>Speaker ${d.who}</b><div class="jp" style="font-size:24px">${esc(d.jp)}</div><div>${esc(d.en)}</div><button class="btn ghost small" onclick="speak('${d.jp}')">▶ Play</button></div>`).join('')}<h3>Choose an appropriate polite response</h3>${['そうですか。ありがとうございます。','うるさい！','しりません。'].map((x,i)=>`<button class="option" onclick="dialogueAnswer(${i})">${x}</button>`).join('')}<div id="dialogueFeedback" aria-live="polite"></div><p class="notice">Original beginner practice dialogue. Some exchanges are intentionally short to focus on response etiquette.</p></div>`}
function dialogueAnswer(i){$('dialogueFeedback').innerHTML=`<div class="feedback ${i===0?'good':'bad'}">${i===0?'Appropriate: “I see. Thank you.”':'Try the polite acknowledgment. Other responses may sound rude or unhelpful in this context.'}</div>`;state.answers.push({lesson:lessonId,format:'dialogue',correct:i===0,date:today()});if(i===0)reward(5);save()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}let shuffled=[];
function sentenceBuilder(l){if(!shuffled.length||shuffled.join('')!==l.builder.slice().sort().join(''))shuffled=shuffle(l.builder);return `<div class="card"><h2>Build the sentence</h2><p>Translate: <b>${esc(l.builderEn)}</b></p><div class="answer" aria-label="Constructed sentence">${builder.map((w,i)=>`<button class="token" onclick="builder.splice(${i},1);render()">${esc(w)} ×</button>`).join('')}</div><div class="grammar-parts">${shuffled.map((w,i)=>`<button class="token" ${builder.filter(x=>x===w).length>=shuffled.filter(x=>x===w).length?'disabled':''} onclick="builder.push(shuffled[${i}]);render()">${esc(w)}</button>`).join('')}</div><button class="btn" onclick="checkBuilder()">Check sentence</button> <button class="btn secondary" onclick="builder=[];render()">Reset</button>${feedback?`<div class="feedback ${feedback.startsWith('Correct')?'good':'bad'}">${esc(feedback)}</div>`:''}</div>`}
function checkBuilder(){let l=LESSONS[lessonId-1],ok=builder.join('|')===l.builder.join('|');feedback=ok?'Correct! '+l.builderEn:'Not quite. Check particle placement and word order. Model: '+l.builder.join(' ');state.answers.push({lesson:lessonId,format:'ordering',correct:ok,date:today()});if(ok)reward(10);save();render()}
function listening(l){return `<div class="card"><h2>Listen and understand</h2><p>Press play, then choose the meaning. If speech is unsupported, reveal the Japanese transcript.</p><div class="row"><button class="btn" onclick="speak(LESSONS[lessonId-1].jp)">▶ Play Japanese</button><button class="btn secondary" onclick="$('transcript').classList.toggle('hidden')">Show / hide transcript</button></div><p id="transcript" class="jp hidden" style="font-size:27px">${esc(l.jp)}</p>${shuffle([l.en,'I do not understand.','Please come here.']).map(x=>`<button class="option" onclick="listenAnswer(this.textContent)">${esc(x)}</button>`).join('')}<div id="listenFeedback" aria-live="polite"></div></div>`}
function listenAnswer(x){let ok=x===LESSONS[lessonId-1].en;$('listenFeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'Correct.':'Incorrect.'} ${esc(LESSONS[lessonId-1].jp)} = ${esc(LESSONS[lessonId-1].en)}</div>`;state.answers.push({lesson:lessonId,format:'listening',correct:ok,date:today()});if(ok)reward(8);save()}
function norm(s){return String(s).normalize('NFKC').toLowerCase().replace(/[\s\u3000。、！？!?.,'"「」]/g,'').replace(/ー/g,'ー')}
function writing(l){let w=l.vocab[0];return `<div class="card"><h2>Typing and writing studio</h2><p>Type the Japanese for <b>${esc(w.en)}</b>. Hiragana or katakana as shown in the vocabulary list.</p><input id="writeInput" class="field" lang="ja" autocomplete="off" placeholder="Type Japanese here"><button class="btn" onclick="checkWriting()">Check</button><div id="writeFeedback" aria-live="polite"></div><div class="divider"></div><h3>Freehand practice</h3><p class="muted">Trace kana or kanji on the canvas with mouse, touch, or stylus. This is unscored practice, not handwriting recognition. Verified stroke-order diagrams are not included.</p><canvas id="draw" width="600" height="250" style="width:100%;height:250px;border:1px dashed #bdb4bd;border-radius:12px;touch-action:none;background:#fff" aria-label="Freehand drawing practice area"></canvas><button class="btn secondary small" onclick="clearCanvas()">Clear canvas</button></div>`}
function checkWriting(){let w=LESSONS[lessonId-1].vocab[0],v=$('writeInput').value,ok=norm(v)===norm(w.jp);$('writeFeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'Correct!':'Expected: '+esc(w.jp)} (${esc(w.en)})</div>`;state.answers.push({lesson:lessonId,format:'typing',correct:ok,date:today()});if(ok)reward(8);save()}
function setupCanvas(){let c=$('draw');if(!c)return;let ctx=c.getContext('2d'),drawing=false;ctx.strokeStyle='#252e59';ctx.lineWidth=5;ctx.lineCap='round';function pos(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>drawing=false}
function clearCanvas(){let c=$('draw');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function makeQuiz(l){let w=l.vocab[Math.floor(Math.random()*l.vocab.length)],other=shuffle(l.vocab.filter(x=>x.id!==w.id)).slice(0,3);let type=Math.floor(Math.random()*4);quiz={w,type,options:shuffle([w,...other]),correct:w.en};quizAnswered=false;feedback=''}
function assessment(l){if(!quiz||quiz.w.id.split('-')[0]!=l.id)makeQuiz(l);let q=quiz;return `<div class="card"><div class="row between"><h2>Lesson assessment</h2><span class="pill">${['Multiple choice','English → Japanese','Fill the blank','Japanese → English'][q.type]}</span></div>${q.type===0||q.type===3?`<p>What does <b class="jp" style="font-size:30px">${esc(q.w.jp)}</b> mean?</p>${q.options.map(w=>`<button class="option" ${quizAnswered?'disabled':''} onclick="checkQuiz('${w.id}')">${esc(w.en)}</button>`).join('')}`:q.type===1?`<p>Select the Japanese for <b>${esc(q.w.en)}</b></p>${q.options.map(w=>`<button class="option jp" ${quizAnswered?'disabled':''} onclick="checkQuiz('${w.id}')">${esc(w.jp)}</button>`).join('')}`:`<p>Fill in the Japanese word meaning <b>${esc(q.w.en)}</b></p><input class="field" id="quizInput" lang="ja" ${quizAnswered?'disabled':''}><button class="btn" ${quizAnswered?'disabled':''} onclick="checkQuiz($('quizInput').value,true)">Check</button>`}${feedback?`<div class="feedback ${feedback.startsWith('Correct')?'good':'bad'}">${esc(feedback)}</div>`:''}<button class="btn secondary" onclick="makeQuiz(LESSONS[lessonId-1]);render()">Next question →</button><p class="notice">Questions are generated from the lesson vocabulary and have recorded difficulty: beginner. See the sentence-builder and listening tabs for two additional formats.</p></div>`}
function checkQuiz(v,typed=false){if(quizAnswered)return;let ok=typed?norm(v)===norm(quiz.w.jp):v===quiz.w.id;quizAnswered=true;feedback=(ok?'Correct! ':'Not quite. ')+quiz.w.jp+' = '+quiz.w.en+'. Review this word in Vocabulary.';state.answers.push({lesson:lessonId,format:['mc','reverse','fill','translation'][quiz.type],correct:ok,date:today()});if(ok)reward(10);save();render()}
function allCards(){return LESSONS.flatMap(l=>l.vocab)}
function reviewCard(id,quality){let old=state.reviews[id]||{ease:2.5,interval:0,reps:0,history:[]};let r={...old};if(quality<3){r.reps=0;r.interval=1}else{r.interval=r.reps===0?1:r.reps===1?6:Math.max(1,Math.round(r.interval*r.ease));r.reps++}r.ease=Math.max(1.3,r.ease+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));let d=new Date();d.setDate(d.getDate()+r.interval);r.due=d.toLocaleDateString('en-CA');r.history=[...(r.history||[]).slice(-99),{date:today(),quality}];state.reviews[id]=r;if(quality>=3){state.learned[id]=true;reward(5)}else activity();save();flashIndex++;flashBack=false;render()}
function flashcards(){let cards=allCards().filter(w=>due(state.reviews[w.id]));if(!cards.length)return `${header('Spaced repetition','No cards due. Return tomorrow or browse lessons.')}<button class="btn" onclick="nav('lessons')">Browse lessons</button>`;let w=cards[flashIndex%cards.length];return `${header('Daily review','SM-2-inspired scheduling: Again resets to 1 day; Good uses 1/6 days then ease-adjusted intervals. Ease has a 1.3 minimum.','SPACED REPETITION')}<p class="pill">${cards.length} cards due · Card ${flashIndex%cards.length+1}</p><div class="flash" role="button" tabindex="0" onclick="flashBack=!flashBack;render()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flashBack=!flashBack;render()}"><div>${flashBack?`<div class="stat">${esc(w.en)}</div><div class="jp">${esc(w.jp)}</div>`:`<div class="jp">${esc(w.jp)}</div><small>Tap or press Enter to reveal meaning</small>`}</div></div><div class="row" style="justify-content:center"><button class="btn secondary" onclick="speak('${w.jp}')">▶ Hear</button>${flashBack?`<button class="btn" onclick="reviewCard('${w.id}',1)">Again</button><button class="btn" onclick="reviewCard('${w.id}',3)">Hard</button><button class="btn" onclick="reviewCard('${w.id}',4)">Good</button><button class="btn" onclick="reviewCard('${w.id}',5)">Easy</button>`:''}</div><p class="notice">Cards begin due immediately. Review history and intervals are stored only in this browser unless exported.</p>`}
function kanaPage(){let list=KANA.filter(x=>x.script===kanaScript&&(kanaExtra==='all'||(kanaExtra==='basic'?!x.extra:kanaExtra==='modified'?x.extra&&!x.combo:x.combo)));return `${header('Kana masterclass','Learn hiragana, katakana, voiced sounds and combinations. Tap any symbol to hear it.','JAPANESE WRITING')}<div class="row"><button class="btn ${kanaScript==='Hiragana'?'':'secondary'}" onclick="kanaScript='Hiragana';render()">Hiragana</button><button class="btn ${kanaScript==='Katakana'?'':'secondary'}" onclick="kanaScript='Katakana';render()">Katakana</button><select class="field" onchange="kanaExtra=this.value;render()"><option value="basic" ${kanaExtra==='basic'?'selected':''}>Basic</option><option value="modified" ${kanaExtra==='modified'?'selected':''}>Dakuten / handakuten</option><option value="combo" ${kanaExtra==='combo'?'selected':''}>Combination sounds</option><option value="all" ${kanaExtra==='all'?'selected':''}>All</option></select></div><div class="kana-grid" style="margin:20px 0">${list.map(x=>`<button class="kana" onclick="kanaPick('${x.ch}')"><strong>${x.ch}</strong>${romaji?`<small>${x.r}</small>`:''}${state.kana[x.ch]?' <small>✓</small>':''}</button>`).join('')}</div><div class="card"><h3>Recognition challenge</h3><button class="btn" onclick="newKanaQuiz()">${kanaQuiz?'New question':'Start quiz'}</button>${kanaQuiz?`<div class="bigjp jp">${kanaQuiz.ch}</div><p>Choose the reading</p>${kanaQuiz.options.map(x=>`<button class="btn secondary" style="margin:4px" onclick="kanaAnswer('${x}')">${x}</button>`).join('')}`:''}${feedback?`<div class="feedback">${esc(feedback)}</div>`:''}<p class="notice">Timed challenge: <button class="btn ghost small" onclick="startTimer()">Start 60 seconds</button> <span id="timerLabel">${challengeEnd?'Challenge active':'Not started'}</span> · Correct: ${challengeScore}</p></div>`}
function kanaPick(ch){let k=KANA.find(x=>x.ch===ch);state.kana[ch]=true;reward(2);feedback=ch+' is read '+k.r+'. Practice its shape and sound.';speak(ch);render()}
function newKanaQuiz(){let pool=KANA.filter(x=>x.script===kanaScript&&!x.extra),k=pool[Math.floor(Math.random()*pool.length)];kanaQuiz={ch:k.ch,r:k.r,options:shuffle([k.r,...shuffle([...new Set(pool.map(x=>x.r).filter(r=>r!==k.r))]).slice(0,3)])};feedback='';render()}
function kanaAnswer(r){let ok=r===kanaQuiz.r;feedback=ok?'Correct! '+kanaQuiz.ch+' = '+r:'Incorrect. '+kanaQuiz.ch+' = '+kanaQuiz.r;if(ok){state.kana[kanaQuiz.ch]=true;reward(4);if(challengeEnd&&Date.now()<challengeEnd)challengeScore++}else activity();save();if(challengeEnd&&Date.now()>challengeEnd){feedback+=' · Time is up! Score: '+challengeScore;challengeEnd=0}kanaQuiz=null;render()}
function startTimer(){challengeEnd=Date.now()+60000;challengeScore=0;newKanaQuiz();let interval=setInterval(()=>{let el=$('timerLabel');if(!el||!challengeEnd){clearInterval(interval);return}let n=Math.max(0,Math.ceil((challengeEnd-Date.now())/1000));el.textContent=n+' seconds left';if(!n){challengeEnd=0;clearInterval(interval);el.textContent='Time up · '+challengeScore+' correct'}},250)}
function kanjiPage(){let k=KANJI[kanjiIndex];return `${header('Kanji explorer','20 foundational characters with common readings and example vocabulary.','FOUNDATIONS')}<div class="kana-grid">${KANJI.map((x,i)=>`<button class="kana" onclick="kanjiIndex=${i};render()"><strong>${x.ch}</strong><small>${state.kanji[x.id]?'✓ ':''}${esc(x.meaning.split(' / ')[0])}</small></button>`).join('')}</div><div class="card" style="margin-top:20px"><div class="bigjp jp">${k.ch}</div><h2>${esc(k.meaning)}</h2><p><b>On’yomi:</b> ${esc(k.on)}</p><p><b>Kun’yomi:</b> ${esc(k.kun)}</p><p><b>Example:</b> ${esc(k.example)}</p><button class="btn secondary" onclick="speak('${k.ch}')">▶ Listen</button> <button class="btn" onclick="state.kanji['${k.id}']=true;reward(5);render()">${state.kanji[k.id]?'✓ Studied':'Mark studied'}</button></div><p class="notice">Readings are common beginner readings, not exhaustive. Some examples use a reading that applies to the whole compound.</p>`}
function settings(){return `${header('Learning settings & backup','Your data lives in this browser. Export regularly to avoid losing it when clearing site data.','PREFERENCES')}<div class="card"><label class="toggle"><input type="checkbox" ${romaji?'checked':''} onchange="romaji=this.checked;render()"> Show romaji in vocabulary</label><p><label>Daily activity goal <input class="field" type="number" min="1" max="200" value="${state.goal}" onchange="state.goal=Math.max(1,Math.min(200,Number(this.value)||15));save()"></label></p><div class="row"><button class="btn" onclick="exportData()">Export progress JSON</button><label class="btn secondary" for="importFile">Import progress JSON</label><input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="importData(this.files[0])"></div><p class="notice">Import replaces current progress. Review JSON before importing files from others. Data is not uploaded anywhere.</p><div class="divider"></div><button class="btn secondary" onclick="if(confirm('Delete all local learning progress?')){state=fresh();save();render()}">Reset progress</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sakura-academy-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{if(file.size>2000000)throw Error('Backup too large');let d=JSON.parse(await file.text()),s=d.state;if(d.version!==1||!s||typeof s!=='object'||Array.isArray(s)||!Array.isArray(s.answers)||typeof s.xp!=='number')throw Error('Invalid backup structure');for(let k of ['reviews','learned','completed','activity','kana','kanji'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error('Invalid '+k);if(!confirm('Replace all current progress with this backup?'))return;state={...fresh(),...s};save();render();alert('Backup imported.')}catch(e){alert('Import failed: '+e.message)}}
function render(){let items=[['dashboard','◈','Dashboard'],['lessons','▤','Lessons'],['kana','あ','Kana studio'],['kanji','字','Kanji explorer'],['flashcards','◇','Flashcards'],['settings','⚙','Settings']];$('sidebar').innerHTML=`<div class="brand"><span class="brandmark">✿</span><span><strong>Sakura Academy</strong><small>日本語を学ぼう</small></span></div><button class="navbtn" onclick="$('sidebar').classList.toggle('collapsed')"><span class="glyph">☰</span><span class="navtext">Collapse menu</span></button>${items.map(x=>`<button class="navbtn ${view===x[0]||(view==='lesson'&&x[0]==='lessons')?'active':''}" onclick="nav('${x[0]}')"><span class="glyph">${x[1]}</span><span class="navtext">${x[2]}</span></button>`).join('')}`;$('content').innerHTML=({dashboard,lessons:()=>header('Lesson library','Twelve original beginner modules. Select a lesson to explore all its learning modes.')+lessonCards(),lesson,kana:kanaPage,kanji:kanjiPage,flashcards,settings})[view]();if(view==='lesson'&&tab==='writing')setupCanvas()}
function validate(){let errors=[],ids=new Set();for(let l of LESSONS){for(let f of ['id','title','jp','en','rule','explain','builder','vocab','dialogue'])if(!l[f]||!l[f].length)errors.push('Missing '+f+' lesson '+l.id);for(let w of l.vocab){if(ids.has(w.id))errors.push('Duplicate '+w.id);ids.add(w.id);for(let f of ['jp','en','romaji','example','exampleEn'])if(!w[f])errors.push('Missing '+f+' '+w.id)}}return errors}
window.addEventListener('error',e=>console.error('App error',e.message));console.info('Content validation:',validate().length?validate():'PASS',LESSONS.length,'lessons',allCards().length,'words',KANA.length,'kana',KANJI.length,'kanji');render();
</script></body></html>
