name: Deploy AI Agent Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '02-my-profile/**'
      - '03-ai-agent-explorer/**'
      - '04-career-guidance/**'
      - 'tiny-llm-from-scratch/ds.tooltip.index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p _site/02-my-profile
          mkdir -p _site/03-ai-agent-explorer
          mkdir -p _site/04-career-guidance
          mkdir -p _site/tiny-llm-from-scratch
          cp -R 03-ai-agent-explorer/. _site/
          cp -R 03-ai-agent-explorer/. _site/03-ai-agent-explorer/
          cp -R 02-my-profile/. _site/02-my-profile/
          cp -R 04-career-guidance/. _site/04-career-guidance/
          cp tiny-llm-from-scratch/ds.tooltip.index.html _site/tiny-llm-from-scratch/
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
