name: Japan news private upload
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate offline, upload October 2 edition, or upload today's prepared edition
        type: choice
        options: [dry-run, current, morning]
        default: dry-run
  # Initially disabled. 22:00 UTC is 07:00 JST the following day.
  # schedule:
  #   - cron: '0 22 * * *'
permissions:
  contents: read
concurrency:
  group: japan-news-channel
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: japan-news-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m news_pipeline dry-run --edition github-fixture
  upload-private:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'current' || inputs.mode == 'morning' || (github.event_name == 'schedule' && vars.MORNING_UPLOAD_ENABLED == 'true'))
    runs-on: [self-hosted, Windows, japan-news-windows]
    environment: youtube-upload
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
        working-directory: japan-news-pipeline
    env:
      NEWS_STATE_ROOT: ${{ vars.NEWS_STATE_ROOT }}
      NEWS_INBOX: ${{ vars.NEWS_INBOX }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      UPLOAD_MODE: ${{ inputs.mode || 'morning' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read authorized token securely and upload privately
        env:
          OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:OAUTH_TOKEN_JSON) { throw 'Missing YOUTUBE_OAUTH_TOKEN secret.' }
          $temporaryToken = Join-Path $env:RUNNER_TEMP ('youtube-' + [guid]::NewGuid().ToString() + '.json')
          try {
            [IO.File]::WriteAllText($temporaryToken, $env:OAUTH_TOKEN_JSON)
            $env:OAUTH_TOKEN_JSON = ''
            $env:YOUTUBE_OAUTH_TOKEN = $temporaryToken
            $env:CI_PROJECT_DIR = $env:GITHUB_WORKSPACE
            & ./tools/gitlab_morning.ps1
          } finally {
            Remove-Item -LiteralPath $temporaryToken -Force -ErrorAction SilentlyContinue
          }
