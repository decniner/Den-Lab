name: Netflix Japan Telegram notifications

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      test_message:
        description: Send a Telegram test message instead of checking releases
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: netflix-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Telegram configuration
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets to enable notifications."
          fi
      - name: Send test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_message && steps.telegram.outputs.configured == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python netflix-notifier/notifier.py --test
      - name: Check for today's Netflix titles
        if: ${{ steps.telegram.outputs.configured == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.test_message) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python netflix-notifier/notifier.py
      - name: Save notification history
        if: ${{ steps.telegram.outputs.configured == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.test_message) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netflix-notifier/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Netflix notification history"
            git push
          fi
