f3d" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="583.0,223.7 456.2,88.5" fill="none" stroke="#b64f3d" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="456.2,88.5 228.7,471.7" fill="none" stroke="#b64f3d" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" stroke-linejoin="round"/><g><circle cx="228.7" cy="471.7" r="12" fill="#194c41"/><text x="228.7" y="475.7" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">S/R</text><text x="245.7" y="475.7" font-size="15" fill="#17211f">Kyoto Station (start and return)</text></g><g><circle cx="671.5" cy="312.2" r="12" fill="#b64f3d"/><text x="671.5" y="316.2" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">01</text><text x="688.5" y="316.2" font-size="15" fill="#17211f">Kiyomizu-dera</text></g><g><circle cx="583.0" cy="223.7" r="12" fill="#b64f3d"/><text x="583.0" y="227.7" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">02</text><text x="600.0" y="227.7" font-size="15" fill="#17211f">Sannenzaka &amp; Ninenzaka</text></g><g><circle cx="456.2" cy="88.5" r="12" fill="#b64f3d"/><text x="456.2" y="92.5" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">03</text><text x="473.2" y="92.5" font-size="15" fill="#17211f">Gion &amp; Shirakawa</text></g><text x="24" y="524" font-size="12" fill="#303b37">Dashed lines are stop-order illustrations only, not walking or transit alignments.</text><text x="24" y="542" font-size="12" fill="#303b37">© OpenStreetMap contributors</text></svg>